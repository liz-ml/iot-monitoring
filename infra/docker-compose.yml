
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: iot-rabbitmq

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: iot_user
      RABBITMQ_DEFAULT_PASS: iot_dev_password

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
